<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>fixture 이미지 생성기 (개발용)</title>
<style>
  body { font-family: sans-serif; background: #111; color: #eee; padding: 1rem; }
  .row { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }
  .card { border: 1px solid #444; padding: 0.5rem; }
  canvas { display: block; max-width: 220px; background: #222; }
  button { margin-top: 0.5rem; }
</style>
</head>
<body>
<h1>meme-card-maker fixture 이미지 생성기</h1>
<p>
  이 페이지는 절차적으로(도형·그라디언트) 5개의 검사용 이미지를 만드는 개발 도구입니다.
  이미지에 저작권이나 EXIF 메타데이터가 없음을 보장하기 위해 모든 픽셀을 canvas 도형/그라디언트로
  직접 그립니다. (실제 커밋된 assets/sample-images/의 5개 파일은 이 페이지와 동일한 로직을
  Python(Pillow)으로 재구현해 생성했습니다 - tools/gen_fixtures 참고 문서는 docs/01_기획.md 참고)
</p>
<div class="row" id="cards"></div>

<script>
function lerp(a, b, t) { return a + (b - a) * t; }

function verticalGradient(ctx, w, h, top, bottom) {
  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, `rgb(${top.join(',')})`);
  grad.addColorStop(1, `rgb(${bottom.join(',')})`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);
}

function radialGradient(ctx, w, h, center, edge) {
  const grad = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, Math.max(w, h) / 2);
  grad.addColorStop(0, `rgb(${center.join(',')})`);
  grad.addColorStop(1, `rgb(${edge.join(',')})`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);
}

function makeSquare(canvas) {
  const w = (canvas.width = 1080), h = (canvas.height = 1080);
  const ctx = canvas.getContext('2d');
  verticalGradient(ctx, w, h, [255, 179, 71], [255, 94, 148]);
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.ellipse(w * 0.35, h * 0.35, w * 0.2, h * 0.2, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#3c3c5a';
  ctx.beginPath();
  ctx.moveTo(w * 0.5, h * 0.6);
  ctx.lineTo(w * 0.9, h * 0.75);
  ctx.lineTo(w * 0.65, h * 0.95);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#28c8b4';
  ctx.fillRect(w * 0.05, h * 0.8, w * 0.3, h * 0.15);
}

function makePortrait(canvas) {
  const w = (canvas.width = 900), h = (canvas.height = 1600);
  const ctx = canvas.getContext('2d');
  verticalGradient(ctx, w, h, [60, 60, 120], [20, 20, 40]);
  ctx.fillStyle = '#ffdc82';
  for (let i = 0; i < 6; i++) {
    const y = h * (0.1 + i * 0.14);
    ctx.beginPath();
    ctx.ellipse(w * 0.5, y + 30, w * 0.3, 30, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.fillStyle = '#0f0f19';
  ctx.fillRect(0, h * 0.85, w, h * 0.15);
}

function makeLandscape(canvas) {
  const w = (canvas.width = 1600), h = (canvas.height = 900);
  const ctx = canvas.getContext('2d');
  verticalGradient(ctx, w, h, [135, 206, 250], [255, 250, 205]);
  ctx.fillStyle = '#509a5a';
  ctx.fillRect(0, h * 0.65, w, h * 0.35);
  ctx.fillStyle = '#326e3c';
  for (let i = 0; i < 8; i++) {
    const x = w * (0.05 + i * 0.12);
    ctx.beginPath();
    ctx.moveTo(x, h * 0.68);
    ctx.lineTo(x + 40, h * 0.5);
    ctx.lineTo(x + 80, h * 0.68);
    ctx.closePath();
    ctx.fill();
  }
  ctx.fillStyle = '#fff5c8';
  ctx.beginPath();
  ctx.ellipse(w * 0.825, h * 0.15, w * 0.075, h * 0.075, 0, 0, Math.PI * 2);
  ctx.fill();
}

function makeTransparent(canvas) {
  const w = (canvas.width = 1080), h = (canvas.height = 1080);
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, w, h); // 배경 완전 투명 유지
  ctx.fillStyle = 'rgba(255,80,80,1)';
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 10;
  ctx.beginPath();
  ctx.ellipse(w / 2, h / 2, w * 0.25, h * 0.25, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.beginPath();
  ctx.ellipse(w / 2, h / 2, w * 0.1, h * 0.1, 0, 0, Math.PI * 2);
  ctx.fill();
}

function makePhotoLike(canvas) {
  const w = (canvas.width = 1200), h = (canvas.height = 1200);
  const ctx = canvas.getContext('2d');
  radialGradient(ctx, w, h, [250, 230, 210], [90, 70, 100]);
  let seed = 42;
  function rand() {
    seed = (seed * 1103515245 + 12345) & 0x7fffffff;
    return (seed % 1000) / 1000;
  }
  for (let i = 0; i < 120; i++) {
    const x = rand() * w, y = rand() * h, r = 5 + rand() * 35;
    ctx.fillStyle = `rgb(${Math.floor(rand()*255)},${Math.floor(rand()*255)},${Math.floor(rand()*255)})`;
    ctx.beginPath();
    ctx.ellipse(x, y, r, r, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

const specs = [
  ['square.png', makeSquare, 'image/png'],
  ['portrait.jpg', makePortrait, 'image/jpeg'],
  ['landscape.jpg', makeLandscape, 'image/jpeg'],
  ['transparent.png', makeTransparent, 'image/png'],
  ['photo-like.jpg', makePhotoLike, 'image/jpeg'],
];

const container = document.getElementById('cards');
specs.forEach(([filename, fn, mime]) => {
  const card = document.createElement('div');
  card.className = 'card';
  const canvas = document.createElement('canvas');
  fn(canvas);
  const btn = document.createElement('button');
  btn.textContent = `${filename} 다운로드`;
  btn.onclick = () => {
    const a = document.createElement('a');
    a.href = canvas.toDataURL(mime, 0.9);
    a.download = filename;
    a.click();
  };
  const label = document.createElement('p');
  label.textContent = `${filename} (${canvas.width}x${canvas.height})`;
  card.appendChild(label);
  card.appendChild(canvas);
  card.appendChild(btn);
  container.appendChild(card);
});
</script>
</body>
</html>
